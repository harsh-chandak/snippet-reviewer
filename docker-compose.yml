services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snippets
      POSTGRES_PASSWORD: snippets
      POSTGRES_DB: snippets
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippets"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgres://snippets:snippets@db:5432/snippets
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web/src:/app/src

volumes:
  db-data:
